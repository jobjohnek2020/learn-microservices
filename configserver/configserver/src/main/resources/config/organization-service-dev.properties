spring.application.name=organization-service
server.port=8081
spring.devtools.livereload.enabled=true
eureka.instance.preferIpAddress=true
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8070/eureka/
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/organizationdb?autoReconnect=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
resilience4j.circuitbreaker.instances.organizationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.organizationService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.organizationService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.organizationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.organizationService.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.organizationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.organizationService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.organizationService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.organizationService.failureRateThreshold=50

management.endpoint.health.showDetails=always
management.health.circuitbreakers.enabled=true
logging.config=classpath:log4j2.xml

spring.cloud.stream.bindings.output.destination=organization-topic
spring.cloud.stream.bindings.output.content-type=application/json
spring.cloud.stream.kafka.binder.brokers=localhost:19092

spring.jackson.deserialization.fail-on-trailing-tokens=true




